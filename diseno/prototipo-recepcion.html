<title>Prototipo de telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de almacén. Barra fija arriba con los módulos en orden (artículos, proveedores, recepciones); una columna de trabajo. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EEF1F5;
  --ink: #172030;
  --muted: #586377;
  --line: #D9DEE6;
  --accent: #1D4F8F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EAF5;
  --ok: #1B7447;   --ok-soft: #E0F2E8;
  --warn: #8C5A00; --warn-soft: #FBEFD6;
  --bad: #A8261E;  --bad-soft: #FBE4E1;
  --off: #5F6878;  --off-soft: #E9ECF0;
  --paper: #FFFFFF; --paper-ink: #000000;   /* la etiqueta es papel térmico: igual en ambos temas */
  --shadow: 0 1px 2px rgba(23,32,48,.06), 0 4px 16px rgba(23,32,48,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F131A; --surface: #161C26; --surface-2: #1C2430; --ink: #E5E9F0; --muted: #9BA5B6; --line: #2A3343;
  --accent: #82A9E2; --accent-ink: #0F131A; --accent-soft: #1C2B42;
  --ok: #5DC28F; --ok-soft: #15301F; --warn: #E2B25A; --warn-soft: #33270F; --bad: #F08B80; --bad-soft: #3A1A17;
  --off: #A3ACBB; --off-soft: #232A35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F131A; --surface: #161C26; --surface-2: #1C2430; --ink: #E5E9F0; --muted: #9BA5B6; --line: #2A3343;
  --accent: #82A9E2; --accent-ink: #0F131A; --accent-soft: #1C2B42;
  --ok: #5DC28F; --ok-soft: #15301F; --warn: #E2B25A; --warn-soft: #33270F; --bad: #F08B80; --bad-soft: #3A1A17;
  --off: #A3ACBB; --off-soft: #232A35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.mono, .code { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand b { font: 700 20px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }
.proto { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; white-space: nowrap }
.scan { flex: 1 1 240px; display: flex; gap: 6px; min-width: 0 }
.scan input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font-family: var(--f-mono) }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.who select { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-width: 100% }
.tabs { max-width: 1180px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 4px; overflow-x: auto }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; display: flex; gap: 8px; align-items: center }
.tab[aria-current="page"] { color: var(--ink); border-color: var(--accent) }
.tab .n { font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 0 7px; color: var(--muted) }
.tab .step { font: 600 11px/1 var(--f-mono); color: var(--muted) }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; display: grid; gap: 18px }

/* Piezas comunes */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.link.mono { white-space: nowrap }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.card h2 { font: 600 15px/1.3 var(--f-body); margin-bottom: 4px }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.plain::before { display: none }
.s-info { color: var(--accent); background: var(--accent-soft) }
.s-ok { color: var(--ok); background: var(--ok-soft) }
.s-warn { color: var(--warn); background: var(--warn-soft) }
.s-bad { color: var(--bad); background: var(--bad-soft) }
.s-off { color: var(--off); background: var(--off-soft) }
.note { font-size: 13px; color: var(--muted) }
.banner { border-radius: var(--r); padding: 10px 14px; font-size: 13px; margin: 0 }
.banner.warn { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn) }
.banner.bad { background: var(--bad-soft); color: var(--ink); border-left: 3px solid var(--bad) }
.banner.ok { background: var(--ok-soft); color: var(--ink); border-left: 3px solid var(--ok) }
.banner.info { background: var(--accent-soft); color: var(--ink); border-left: 3px solid var(--accent) }

.tablewrap { overflow-x: auto; margin-inline: -4px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--surface-2) }
tr.off td { color: var(--muted) }
.neg { color: var(--bad) } .pos { color: var(--warn) } .zero { color: var(--ok) }

.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between }
.page-head h1 { font: 700 30px/1.05 var(--f-display); letter-spacing: .01em }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch }
.counts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.empty { text-align: center; padding: 34px 18px; display: grid; gap: 10px; justify-items: center }
.empty h2 { font: 700 22px/1.1 var(--f-display) }
.empty p { margin: 0; color: var(--muted); max-width: 52ch }

/* Formularios */
.form { display: grid; gap: 14px }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field label, .field .lbl { font-size: 12px; font-weight: 500; color: var(--muted) }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.field .hint { font-size: 12px; color: var(--muted) }
.field .big { font: 500 26px/1.1 var(--f-mono); padding: 10px 12px; letter-spacing: .02em }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; width: max-content; max-width: 100% }
.seg button { border: 0; background: var(--surface); padding: 9px 18px; cursor: pointer; font-weight: 500 }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.colores td { padding: 6px 6px }
.colores input, .colores select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.colores input.up { text-transform: uppercase; font-family: var(--f-mono) }
.colores .w-color { min-width: 150px } .colores .w-cod { min-width: 140px } .colores .w-abr { min-width: 96px; width: 110px } .colores .w-prev { min-width: 170px }
.form-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.art { min-width: 170px }
.grupo-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 8px }
.grupo-head h2 { font: 700 22px/1.1 var(--f-display); margin: 0 }
.lock { font-size: 11px; color: var(--muted) }

/* Recepción */
.rec-head { display: grid; gap: 14px }
.rec-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.rec-title h1 { font: 700 34px/1 var(--f-display); letter-spacing: .01em }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 20px; margin: 0 }
.facts div { min-width: 0 }
.facts dt { font-size: 12px; color: var(--muted) }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px }
.steps li { border-top: 4px solid var(--line); padding-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.3 }
.steps li.done { border-color: var(--ok); color: var(--ink) }
.steps li.now { border-color: var(--accent); color: var(--ink); font-weight: 600 }
.steps small { display: block; font-weight: 400; color: var(--muted) }
.next { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px }
.next p { margin: 0; min-width: 0; flex: 1 1 280px }
.next .acts { display: flex; flex-wrap: wrap; gap: 8px }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start }
.next-code { font-size: 13px; color: var(--muted) }
.next-code b { font-family: var(--f-mono); color: var(--ink); font-weight: 500 }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 60px }
.bar i { display: block; height: 100%; background: var(--accent) }
.bar i.full { background: var(--ok) }
.decide { display: grid; gap: 12px }
.decide textarea { min-height: 70px; resize: vertical }
.acts-row { display: flex; flex-wrap: wrap; gap: 8px }
.tiempos tr.total td { font-weight: 600; border-top: 2px solid var(--line) }
.tiempos .curso { color: var(--accent); font-weight: 500 }

/* Etiqueta 100 x 150 mm */
.label {
  width: 100%; max-width: 300px; aspect-ratio: 100 / 150; background: var(--paper); color: var(--paper-ink);
  border: 1px solid #c9ccd1; border-radius: 3px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px;
  font-family: var(--f-body); box-shadow: var(--shadow); container-type: inline-size;
}
.label .l-top { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--paper-ink); padding-bottom: 5px; gap: 6px }
.label .l-code { font: 700 clamp(18px, 10.5cqi, 31px)/1 var(--f-display); letter-spacing: .01em; text-align: center; white-space: nowrap }
.label .l-qr { flex: 1; display: grid; place-items: center; min-height: 0 }
.label .l-qr svg { width: auto; height: 100%; max-height: 170px; max-width: 100%; display: block }
.label .l-art { font-size: 11px; line-height: 1.25; border-top: 2px solid var(--paper-ink); padding-top: 6px }
.label .l-art b { font-family: var(--f-mono); font-size: 12px }
.label .l-kg { display: flex; justify-content: space-between; align-items: baseline; gap: 6px }
.label .l-kg span { font-size: 9px; letter-spacing: .08em; text-transform: uppercase }
.label .l-kg strong { font: 700 clamp(22px, 13cqi, 38px)/1 var(--f-display) }
.label .l-foot { display: flex; justify-content: space-between; font-size: 10px; border-top: 1px solid var(--paper-ink); padding-top: 5px; gap: 6px }

/* Etiqueta de ubicación (anaquel o muelle), mismo papel 100 x 150 mm */
.label.ubi { gap: 6px; text-align: center }
.label.ubi .u-tipo { font: 700 clamp(14px, 8cqi, 22px)/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase }
.label.ubi .u-code { font: 700 clamp(22px, 15cqi, 44px)/1 var(--f-display); letter-spacing: .02em; white-space: nowrap }
.label.ubi .u-partes { display: flex; justify-content: space-around; border-top: 2px solid var(--paper-ink); padding-top: 6px; gap: 4px }
.label.ubi .u-partes div { display: grid; line-height: 1 }
.label.ubi .u-partes span { font-size: 8px; letter-spacing: .08em; text-transform: uppercase }
.label.ubi .u-partes b { font: 700 clamp(20px, 13cqi, 38px)/1 var(--f-display) }

/* Pasillos y racks plegables */
.fold { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; min-width: 0 }
.fold .chev { display: inline-block; width: 18px; font-size: 14px; color: var(--muted); transition: transform .15s }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg) }
.fold .fold-t { display: block; font: 700 22px/1.1 var(--f-display) }
.fold.chico .fold-t { font-size: 17px }
.fold .fold-r { display: block }
.fold:hover .fold-t { color: var(--accent) }
.racks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-top: 10px; padding-left: 28px; border-left: 2px solid var(--line); margin-left: 8px }
.rack { min-width: 0 }
.rack + .rack { border-top: 1px solid var(--line); padding-top: 6px }
@media (max-width: 640px) { .racks { padding-left: 12px; margin-left: 4px } }

/* Ventana */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.55); z-index: 40; display: grid; place-items: center; padding: 16px; overflow-y: auto }
.dialog { background: var(--surface); border-radius: 12px; max-width: 760px; width: 100%; padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow); max-height: calc(100vh - 32px); overflow-y: auto }
.dialog-head { display: flex; justify-content: space-between; gap: 12px; align-items: start }
.dialog-head h2 { font: 700 24px/1.1 var(--f-display) }
.label-view { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start }
.cedula { white-space: pre-wrap; background: var(--surface-2); border-radius: var(--r); padding: 10px 12px; font: 13px/1.5 var(--f-mono); margin: 6px 0 12px; overflow-wrap: anywhere }
.stack { display: grid; gap: 10px; min-width: 0 }
.lote { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; justify-items: center }
.lote .label { box-shadow: none }
@media (max-width: 640px) { .label-view { grid-template-columns: minmax(0, 1fr) } .label { margin: 0 auto } .steps { grid-template-columns: repeat(6, minmax(56px, 1fr)); overflow-x: auto } }

.ficha { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); align-items: start }
@media (max-width: 760px) { .ficha { grid-template-columns: minmax(0, 1fr) } }
.events td:first-child { white-space: nowrap; color: var(--muted) }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(560px, calc(100% - 32px)); padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--shadow) }
.toast.error { background: var(--bad); color: #fff }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Sistema para telas</b><span class="proto">Prototipo</span></div>
    <form class="scan" id="scan-form" role="search">
      <input id="scan" placeholder="Escanea o escribe un código de rollo" aria-label="Código de rollo" autocomplete="off">
      <button class="btn" type="submit">Abrir</button>
    </form>
    <label class="who" for="user">Viendo como
      <select id="user"></select>
    </label>
  </div>
  <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
</header>

<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- Personas y permisos de ejemplo
const TODOS = ["catalogo.ver", "catalogo.editar", "recepcion.ver", "recepcion.crear", "recepcion.registrar_pieza", "recepcion.verificar", "recepcion.aprobar", "recepcion.anular", "pieza.liberar", "pieza.resolver_incidencia", "pieza.ubicar", "compra.crear", "etiqueta.imprimir"];
const USERS = {
  admin:  { nombre: "Administrador", rol: "Administrador de empresa", permisos: TODOS },
  ana:    { nombre: "Ana Pérez",  rol: "Gerente de recepción"   , permisos: ["catalogo.ver", "recepcion.ver", "recepcion.crear", "recepcion.registrar_pieza", "recepcion.verificar", "pieza.ubicar", "etiqueta.imprimir"] },
  carlos: { nombre: "Carlos Ruiz", rol: "Personal de almacén",     permisos: ["catalogo.ver", "recepcion.ver", "recepcion.registrar_pieza", "pieza.ubicar", "etiqueta.imprimir"] },
  luis:   { nombre: "Luis Mora",  rol: "Gerente general",          permisos: ["catalogo.ver", "catalogo.editar", "compra.crear", "recepcion.ver", "recepcion.aprobar", "recepcion.anular", "pieza.liberar", "pieza.resolver_incidencia", "etiqueta.imprimir"] },
};
const UN = {
  kg: { nombre: "Kilo",  corto: "kg", campo: "Peso neto", tope: 60 },
  m:  { nombre: "Metro", corto: "m",  campo: "Metraje",   tope: 150 },
};
const MUELLE = "Muelle de recepción";   // solo para recepciones creadas antes de que existiera el catálogo de muelles
const DOCS = ["Factura", "Orden de compra", "Lista de empaque"];
const EST_REC = {
  en_preparacion:         ["En registro", "s-info", "Registrar rollos"],
  pendiente_verificacion: ["Por verificar", "s-info", "Revisar y enviar al gerente"],
  pendiente_autorizacion: ["Esperando al gerente", "s-warn", "Aprobar o rechazar"],
  verificada:             ["Aprobada, por liberar", "s-warn", "Liberar rollos"],
  por_ubicar:             ["Liberada, por trasladar", "s-warn", "Trasladar rollos a anaqueles"],
  cerrada:                ["Cerrada", "s-ok", "Nada"],
  rechazada:              ["Rechazada", "s-bad", "Nada"],
};
const EST_PIEZA = {
  en_cuarentena:          ["En cuarentena", "s-warn"],
  pendiente_autorizacion: ["Con incidencia", "s-bad"],
  liberada:               ["Liberado, en muelle", "s-warn"],
  disponible:             ["Disponible para venta", "s-ok"],
  rechazada:              ["Rechazada", "s-bad"],
  anulada:                ["Anulada", "s-off"],
};
const EVENTO = {
  registrada: "Registrado en recepción", etiqueta: "Etiqueta impresa", incidencia: "Incidencia registrada",
  incidencia_resuelta: "Incidencia resuelta", aprobada: "Recepción aprobada por el gerente", liberada: "Liberado de cuarentena", ubicada: "Trasladado a anaquel",
  rechazada: "Rechazado", anulada: "Anulado",
};

// ---------------------------------------------------------------- Estado (solo en este navegador)
const CLAVE = "telas-prototipo-v2";
const D = { articulos: [], proveedores: [], ubicaciones: [], ocs: [], recs: [], piezas: [], contador: {}, sec: { art: 0, prov: 0, rec: 0, ubi: 0, oc: 0 } };
const S = { user: "admin", view: "articulos", rec: null, pieza: null, modal: null,
            artForm: null, provForm: null, ubiForm: null, ocForm: null, recForm: null,
            form: { art: "", peso: "", fab: "" }, ubi: { anaquel: "", rollo: "" }, motivo: "", sel: {} };
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(D)) } catch (e) {} }
function cargar() {
  try { const t = localStorage.getItem(CLAVE); if (t) Object.assign(D, JSON.parse(t)) } catch (e) {}
  D.ubicaciones ||= []; D.sec.ubi ||= 0; D.ocs ||= []; D.sec.oc ||= 0; D.ubicaciones.forEach(x => { x.tipo ||= "anaquel" });
  // Datos de la versión anterior: allí la recepción se cerraba al liberar y el rollo ya llevaba su ubicación.
  D.recs.forEach(r => { if (r.estado === "cerrada" && !r.t) piezasDe(r).forEach(p => { if (p.estado === "liberada") p.estado = "disponible" }) });
}

// ---------------------------------------------------------------- Utilidades
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` }
function ymd(f) { return f.replaceAll("-", "") }
function dmy(f) { const [y, m, d] = f.split("-"); return `${d}/${m}/${y}` }
function ahora() { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` }
function hoy() { return `${dmy(hoyISO())} ${ahora()}` }
function horaDe(ms) { const d = new Date(ms); return `${dmy(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` }
function dur(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (s < 60) return `${s} s`;
  if (m < 60) return `${m} min`;
  if (h < 24) return `${h} h ${m % 60} min`;
  return `${d} d ${h % 24} h`;
}
function n2(n) { return Number(n).toLocaleString("es", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
function cant(n, un) { return `${n2(n)} ${UN[un].corto}` }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]) }
function u() { return USERS[S.user] }
function puede(p) { return u().permisos.includes(p) }
function art(id) { return D.articulos.find(a => a.id === id) }
function prov(id) { return D.proveedores.find(p => p.id === id) }
function recById(id) { return D.recs.find(r => r.id === id) }
function piezasDe(r) { return D.piezas.filter(p => p.rec === r.id) }
function nombreArt(a) { return `${a.tela} ${a.color}` }
function quien(id) { return USERS[id]?.nombre || id }
function decimal(txt) { return /^\d+([.,]\d{1,2})?$/.test(String(txt).trim()) ? Number(String(txt).trim().replace(",", ".")) : NaN }
function porUnidad(items, f) {
  const t = {}; items.forEach(x => { t[x.un] = (t[x.un] || 0) + f(x) });
  return Object.entries(t).map(([k, v]) => cant(Math.round(v * 100) / 100, k)).join(" · ") || "—";
}

class Regla extends Error {}
function exigir(p) { if (!puede(p)) throw new Regla(`${u().nombre} (${u().rol}) no tiene permiso para esta acción.`) }

// ---------------------------------------------------------------- Módulo 1 · Artículos
function sinAcentos(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase() }
function iniciales(txt, n) { return sinAcentos(txt).split(/[^A-Z0-9]+/).filter(Boolean).map(w => w[0]).join("").slice(0, n) }
function letras(txt) { return sinAcentos(txt).replace(/[^A-Z0-9]/g, "") }
function abrUsadas(excluirFila) {
  const s = new Set(D.articulos.map(a => a.abr));
  (S.artForm?.filas || []).forEach((f, i) => { if (i !== excluirFila && f.abr) s.add(f.abr) });
  return s;
}
function sugerirAbr(tela, color, fila) {
  const base = iniciales(tela, 3), col = letras(color);
  if (!base || !col) return "";
  const usadas = abrUsadas(fila);
  for (let k = 1; k <= col.length && base.length + k <= 6; k++) { const c = base + col.slice(0, k); if (!usadas.has(c)) return c }
  for (let d = 2; d < 10; d++) { const c = (base + col[0]).slice(0, 5) + d; if (!usadas.has(c)) return c }
  return "";
}
function nuevaFila() { return { color: "", codigo: "", abr: "", abrTocada: false } }
function abrirFormArticulo(desde) {
  const a = desde && art(desde);
  S.artForm = { tela: a ? a.tela : "", unidad: a ? a.un : "kg", ancho: a?.ancho ? String(a.ancho) : "", comp: a?.comp || "",
                tope: a ? String(a.tope).replace(".", ",") : "", fija: !!a, filas: [nuevaFila(), nuevaFila()] };
}
const ACC_ART = {
  guardar() {
    exigir("catalogo.editar");
    const f = S.artForm, tela = f.tela.trim().replace(/\s+/g, " ");
    if (!tela) throw new Regla("Escribe el nombre de la tela, por ejemplo Microfibra unicolor.");
    const otra = D.articulos.find(a => a.tela.toLowerCase() === tela.toLowerCase());
    if (otra && !f.fija) throw new Regla(`${otra.tela} ya existe. Usa “Agregar colores” en esa tela para que todos sus colores compartan unidad y ancho.`);
    const tope = f.tope.trim() ? decimal(f.tope) : UN[f.unidad].tope;
    if (!(tope > 0)) throw new Regla("El tope por rollo debe ser un número mayor que cero, con hasta 2 decimales.");
    const ancho = f.ancho.trim() ? decimal(f.ancho) : null;
    if (f.ancho.trim() && !(ancho > 0)) throw new Regla("El ancho es un número en centímetros, por ejemplo 150.");
    const filas = f.filas.filter(x => x.color.trim() || x.codigo.trim());
    if (!filas.length) throw new Regla("Agrega al menos un color con su código.");
    const codigos = new Set(D.articulos.map(a => a.codigo)), abrs = new Set(D.articulos.map(a => a.abr));
    const colores = new Set(D.articulos.filter(a => a.tela.toLowerCase() === tela.toLowerCase()).map(a => a.color.toLowerCase()));
    filas.forEach(x => {
      const n = `Fila ${f.filas.indexOf(x) + 1}`, cod = x.codigo.trim().toUpperCase(), ab = x.abr.trim().toUpperCase();
      if (!x.color.trim()) throw new Regla(`${n}: falta el color.`);
      if (colores.has(x.color.trim().toLowerCase())) throw new Regla(`${tela} ${x.color.trim()} ya existe en el catálogo.`);
      if (!/^[A-Z0-9_-]{2,20}$/.test(cod)) throw new Regla(`${n}: el código lleva de 2 a 20 letras, números, guion o guion bajo, sin espacios.`);
      if (codigos.has(cod)) throw new Regla(`El código ${cod} ya está usado. Cada artículo tiene un código único.`);
      if (!/^[A-Z0-9]{2,6}$/.test(ab)) throw new Regla(`${n}: la abreviatura lleva de 2 a 6 letras o números.`);
      if (abrs.has(ab)) throw new Regla(`La abreviatura ${ab} ya está usada. Debe ser única porque va dentro del código de cada rollo.`);
      colores.add(x.color.trim().toLowerCase()); codigos.add(cod); abrs.add(ab);
    });
    filas.forEach(x => D.articulos.push({
      id: "a" + (++D.sec.art), tela: otra ? otra.tela : tela, color: x.color.trim().replace(/^./, c => c.toUpperCase()),
      codigo: x.codigo.trim().toUpperCase(), abr: x.abr.trim().toUpperCase(), un: f.unidad, ancho, comp: f.comp.trim(), tope, activo: true, usada: false }));
    S.artForm = null;
    return `${filas.length === 1 ? "1 artículo creado" : `${filas.length} artículos creados`} en ${otra ? otra.tela : tela}. Ya se pueden usar en una recepción.`;
  },
  activar(a) { exigir("catalogo.editar"); a.activo = !a.activo; return a.activo ? `${a.codigo} activo de nuevo.` : `${a.codigo} desactivado: no aparece en recepciones nuevas.` },
};

function refrescarSugerencias() {
  const f = S.artForm; if (!f) return;
  f.filas.forEach((x, i) => {
    if (!x.abrTocada) {
      x.abr = sugerirAbr(f.tela, x.color, i);
      const el = document.querySelector(`[data-row="${i}"][data-col="abr"]`); if (el) el.value = x.abr;
    }
    const pv = document.getElementById(`prev-${i}`); if (pv) pv.textContent = x.abr ? `${ymd(hoyISO())}-${x.abr}-001` : "";
  });
}

function ubiPorCodigo(cod) { return D.ubicaciones.find(x => x.codigo === String(cod).trim().toUpperCase()) }
const TIPO_UBI = { muelle: ["Muelle", "Donde se descarga el contenedor y se registran los rollos"], anaquel: ["Rack", "Cada división del rack es un anaquel, donde se guardan los rollos disponibles para la venta"] };
const dos = n => String(n).padStart(2, "0");
function codigoAnaquel(pasillo, rack, div) { return `P${dos(pasillo)}-R${dos(rack)}-A${dos(div)}` }
function nombreUbi(x) { return x.tipo === "anaquel" && x.pasillo ? `Pasillo ${x.pasillo} · Rack ${x.rack} · Anaquel ${x.div}` : x.desc || "" }
function entero(txt, min, max) { const n = Number(String(txt).trim()); return Number.isInteger(n) && n >= min && n <= max ? n : NaN }
const ACC_UBI = {
  guardar() {
    exigir("catalogo.editar");
    const f = S.ubiForm;
    if (f.tipo === "muelle") {
      const cod = f.codigo.trim().toUpperCase();
      if (!/^[A-Z0-9_-]{1,20}$/.test(cod)) throw new Regla("El código del muelle lleva letras, números o guion, sin espacios. Por ejemplo MUELLE-1.");
      if (ubiPorCodigo(cod)) throw new Regla(`El código ${cod} ya existe. Cada ubicación tiene un código único.`);
      D.ubicaciones.push({ id: "u" + (++D.sec.ubi), codigo: cod, tipo: "muelle", desc: f.desc.trim(), activo: true });
      S.ubiForm = { ...f, codigo: "", desc: "" };
      UI.abiertos.muelles = true; guardarUI();
      return `Muelle ${cod} creado.`;
    }
    const pasillo = entero(f.pasillo, 1, 99), rack = entero(f.rack, 1, 99), divs = entero(f.divs, 1, 20);
    if (isNaN(pasillo)) throw new Regla("El pasillo es un número del 1 al 99.");
    if (isNaN(rack)) throw new Regla("El rack es un número del 1 al 99.");
    if (isNaN(divs)) throw new Regla("Las divisiones del rack son un número del 1 al 20.");
    const nuevos = [], ya = [];
    for (let d = 1; d <= divs; d++) {
      const cod = codigoAnaquel(pasillo, rack, d);
      if (ubiPorCodigo(cod)) { ya.push(cod); continue }
      D.ubicaciones.push({ id: "u" + (++D.sec.ubi), codigo: cod, tipo: "anaquel", pasillo, rack, div: d, desc: f.desc.trim(), activo: true });
      nuevos.push(cod);
    }
    if (!nuevos.length) throw new Regla(`El rack ${rack} del pasillo ${pasillo} ya tiene sus ${divs} anaqueles. Para agregar divisiones, sube el número.`);
    S.ubiForm = { ...f, rack: String(rack + 1), desc: "" };
    UI.abiertos[`p${pasillo}`] = true; UI.abiertos[`p${pasillo}-r${rack}`] = true; guardarUI();
    return `Rack ${rack} del pasillo ${pasillo}: ${nuevos.length === 1 ? "1 anaquel creado" : `${nuevos.length} anaqueles creados`} (${nuevos[0]}${nuevos.length > 1 ? ` a ${nuevos.at(-1)}` : ""}).${ya.length ? ` ${ya.length} ya existían.` : ""} Imprime sus etiquetas y pégalas en cada división.`;
  },
  activar(x) { exigir("catalogo.editar"); x.activo = !x.activo; return x.activo ? `${x.codigo} activo de nuevo.` : `${x.codigo} desactivado: ya no se usa en recepciones ni traslados nuevos.` },
};

// ---------------------------------------------------------------- Módulo 4 · Órdenes de compra
const EST_OC = { abierta: ["Por llegar", "s-info"], parcial: ["Recibida en parte", "s-warn"], completa: ["Recibida completa", "s-ok"], anulada: ["Anulada", "s-off"] };
function ocById(id) { return D.ocs.find(o => o.id === id) }
function r2(n) { return Math.round(n * 100) / 100 }
// Avance de una orden: lo recibido sale de los rollos vivos de sus recepciones no rechazadas.
function avanceOC(o) {
  const recs = D.recs.filter(r => r.oc === o.id && r.estado !== "rechazada"), ids = new Set(recs.map(r => r.id));
  const lineas = o.lineas.map(l => {
    const a = art(l.art), vivas = D.piezas.filter(p => ids.has(p.rec) && p.art === l.art && !["anulada", "rechazada"].includes(p.estado));
    const recibido = r2(vivas.reduce((s, p) => s + p.cantidad, 0));
    return { ...l, a, un: a.un, recibido, rollosRec: vivas.length, pendiente: Math.max(0, r2(l.pedido - recibido)) };
  });
  const estado = o.anulada ? "anulada" : lineas.every(l => l.pendiente === 0) ? "completa" : recs.length ? "parcial" : "abierta";
  return { lineas, recs, estado };
}
function ocsAbiertas() { return D.ocs.filter(o => ["abierta", "parcial"].includes(avanceOC(o).estado)) }
function abrirFormOC() { S.ocForm = { prov: D.proveedores.find(p => p.activo)?.id || "", ref: "", llegada: "", lineas: [{ art: "", cant: "", rollos: "" }] } }
const ACC_OC = {
  guardar() {
    exigir("compra.crear");
    const f = S.ocForm;
    if (!prov(f.prov)) throw new Regla("Elige el proveedor.");
    if (f.llegada && !/^\d{4}-\d{2}-\d{2}$/.test(f.llegada)) throw new Regla("La fecha estimada de llegada no es válida.");
    const lineas = f.lineas.filter(l => l.art || l.cant.trim() || l.rollos.trim());
    if (!lineas.length) throw new Regla("Agrega al menos un artículo pedido.");
    const vistos = new Set();
    const ok = lineas.map((l, i) => {
      const a = art(l.art);
      if (!a) throw new Regla(`Línea ${i + 1}: elige el artículo. Si no existe, créalo antes en Artículos.`);
      if (vistos.has(a.id)) throw new Regla(`${a.codigo} está repetido. Pon cada artículo una sola vez con su total.`);
      vistos.add(a.id);
      const c = decimal(l.cant);
      if (!(c > 0)) throw new Regla(`Línea ${i + 1}: escribe la cantidad pedida en ${UN[a.un].corto}, con hasta 2 decimales.`);
      const ro = l.rollos.trim() ? Number(l.rollos) : null;
      if (l.rollos.trim() && !(Number.isInteger(ro) && ro > 0)) throw new Regla(`Línea ${i + 1}: los rollos pedidos son un número entero.`);
      return { art: a.id, pedido: c, rollos: ro };
    });
    const o = { id: "o" + (++D.sec.oc), numero: `OC-${String(D.sec.oc).padStart(6, "0")}`, prov: f.prov, ref: f.ref.trim(), llegada: f.llegada,
                fecha: hoyISO(), por: S.user, hora: hoy(), lineas: ok, anulada: false };
    D.ocs.push(o); S.ocForm = null;
    return `Orden ${o.numero} registrada. Cuando llegue el contenedor, la recepción se abre desde esta orden.`;
  },
  anular(o) {
    exigir("compra.crear");
    if (avanceOC(o).recs.length) throw new Regla(`La orden ${o.numero} ya tiene recepciones: no se anula.`);
    o.anulada = true; o.anuladaPor = S.user; o.anuladaHora = hoy();
    return `Orden ${o.numero} anulada. Su número no se reutiliza.`;
  },
};

// ---------------------------------------------------------------- Módulo 5 · Recepciones
function siguienteCodigo(fecha, abr, consumir) {
  const k = ymd(fecha) + abr, n = (D.contador[k] || 0) + 1;
  if (consumir) D.contador[k] = n;
  return `${ymd(fecha)}-${abr}-${n < 1000 ? String(n).padStart(3, "0") : n}`;
}
// Tiempos: cada etapa guarda cuándo terminó y quién la cerró. Se calculan duraciones, nunca se editan.
function marcar(r, k) { (r.t ||= {})[k] = { ms: Date.now(), por: S.user } }
function evento(p, tipo, de, a, nota) { p.eventos.push({ hora: hoy(), tipo, de, a, quien: S.user, nota: nota || "" }) }

function cuadre(r) {
  const ps = piezasDe(r);
  const lineas = r.lineas.map(l => {
    const a = art(l.art), vivas = ps.filter(p => p.art === l.art && p.estado !== "anulada");
    const recibido = Math.round(vivas.reduce((s, p) => s + p.cantidad, 0) * 100) / 100;
    const dif = Math.round((recibido - l.esperado) * 100) / 100;
    return { ...l, a, un: a.un, recibido, dif, pct: Math.round(dif * 10000 / l.esperado) / 100,
             registradas: vivas.length, anuladas: ps.filter(p => p.art === l.art && p.estado === "anulada").length,
             conIncidencia: vivas.filter(p => p.estado === "pendiente_autorizacion").length };
  });
  return { lineas, hayDif: lineas.some(l => l.dif !== 0 || (l.rollos && l.registradas !== l.rollos)),
           abiertas: r.incidencias.filter(i => i.abierta).length,

function pendientesDeImprimir(r) {
  return piezasDe(r).filter(p => !p.impresiones && ["en_cuarentena", "pendiente_autorizacion"].includes(p.estado))

}
function intentarCerrar(r) {
  const ps = piezasDe(r);

}

function pasos(r) {

}
function qrSvg(texto) {

  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];

  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="Código QR del rollo" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

  const add = (tela, un, ancho, comp, tope, filas) => filas.forEach(([color, codigo, abr]) =>
    D.articulos.push({ id: "a" + (++D.sec.art), tela, color, codigo, abr, un, ancho, comp, tope, activo: true, usada: false }));
  D.sec.ubi ||= 0;
  if (!D.articulos.some(a => a.tela === "Microfibra unicolor"))
    add("Microfibra unicolor", "kg", 150, "100% poliéster", 60, [["Blanco", "MFU-001", "MUB"], ["Negro", "MFU-002", "MUN"], ["Rojo", "MFU-003", "MUR"], ["Azul rey", "MFU-004", "MUA"]]);
  if (!D.articulos.some(a => a.tela === "Gabardina stretch"))
    add("Gabardina stretch", "m", 150, "97% algodón, 3% elastano", 150, [["Negro", "GAB-001", "GSN"], ["Beige", "GAB-002", "GSB"]]);
  if (!D.proveedores.length) D.proveedores.push({ id: "p" + (++D.sec.prov), codigo: "TEXPAC", nombre: "Textiles del Pacífico", fiscal: "", pais: "China", activo: true });

    [[1, 1], [1, 2]].forEach(([pasillo, rack]) => { for (let div = 1; div <= 3; div++) D.ubicaciones.push({ id: "u" + (++D.sec.ubi), codigo: codigoAnaquel(pasillo, rack, div), tipo: "anaquel", pasillo, rack, div, desc: "", activo: true }) });
  }
  return "Ejemplo cargado: microfibra por kilo en 4 colores, gabardina stretch por metro en 2 colores, un proveedor, un muelle y el pasillo 1 con 2 racks de 3 anaqueles.";
}

  if (ds.of) { S.ocForm[ds.of] = t.value; return }
  if (ds.rf) { S.recForm[ds.rf] = t.value; return }
  if (t.id === "f-art") { S.form.art = t.value; S.form.peso = ""; S.form.fab = ""; render(); return listoParaPesar() }
  if (ds.sel) S.sel[ds.sel] = t.checked;
  else if (t.id === "user") { S.user = t.value; S.motivo = ""; render(); toast(`Ahora ves la aplicación como ${u().nombre}, ${u().rol.toLowerCase()}.`) }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "art-form") return hacer(ACC_ART.guardar);
  if (id === "prov-form") return hacer(ACC_PROV.guardar);
  if (id === "ubi-form") { hacer(ACC_UBI.guardar); return document.getElementById(S.ubiForm?.tipo === "muelle" ? "uf-codigo" : "uf-rack")?.focus() }
  if (id === "ubic-form") {
    // Escáner: tras leer el anaquel, el foco pasa al rollo; tras cada rollo, vuelve al rollo.
    if (S.ubi.anaquel.trim() && !S.ubi.rollo.trim() && document.activeElement?.id === "u-anaquel") return document.getElementById("u-rollo")?.focus();
    hacer(() => ACC.ubicar(recById(S.rec), S.ubi.rollo, S.ubi.anaquel)); return listoParaUbicar();
  }
  if (id === "oc-form") return hacer(ACC_OC.guardar);
  if (id === "rec-form") { hacer(ACC.crearRecepcion); return listoParaPesar() }
  if (id === "reg") { hacer(() => ACC.registrar(recById(S.rec))); return listoParaPesar() }
  if (id === "scan-form") {
    const q = document.getElementById("scan").value.trim().toUpperCase();
    if (!q) return;
    const p = D.piezas.find(x => x.codigo === q) || D.piezas.find(x => x.codigo.endsWith(q));
    if (!p) return toast(`No existe el rollo ${q} en esta empresa.`, true);
    document.getElementById("scan").value = "";
    ir("pieza", { pieza: p.codigo, rec: p.rec });
  }
});

document.getElementById("user").innerHTML = Object.entries(USERS).map(([k, v]) => `<option value="${k}">${v.nombre} · ${v.rol}</option>`).join("");
cargar();
if (D.recs.length) S.view = "recepciones";
render();
</script>
