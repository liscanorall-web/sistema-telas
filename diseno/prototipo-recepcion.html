<title>Prototipo de telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de almacén. Barra fija arriba con los módulos en orden (artículos, proveedores, recepciones); una columna de trabajo. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EEF1F5;
  --ink: #172030;
  --muted: #586377;
  --line: #D9DEE6;
  --accent: #1D4F8F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EAF5;
  --ok: #1B7447;   --ok-soft: #E0F2E8;
  --warn: #8C5A00; --warn-soft: #FBEFD6;
  --bad: #A8261E;  --bad-soft: #FBE4E1;
  --off: #5F6878;  --off-soft: #E9ECF0;
  --paper: #FFFFFF; --paper-ink: #000000;   /* la etiqueta es papel térmico: igual en ambos temas */
  --shadow: 0 1px 2px rgba(23,32,48,.06), 0 4px 16px rgba(23,32,48,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F131A; --surface: #161C26; --surface-2: #1C2430; --ink: #E5E9F0; --muted: #9BA5B6; --line: #2A3343;
  --accent: #82A9E2; --accent-ink: #0F131A; --accent-soft: #1C2B42;
  --ok: #5DC28F; --ok-soft: #15301F; --warn: #E2B25A; --warn-soft: #33270F; --bad: #F08B80; --bad-soft: #3A1A17;
  --off: #A3ACBB; --off-soft: #232A35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F131A; --surface: #161C26; --surface-2: #1C2430; --ink: #E5E9F0; --muted: #9BA5B6; --line: #2A3343;
  --accent: #82A9E2; --accent-ink: #0F131A; --accent-soft: #1C2B42;
  --ok: #5DC28F; --ok-soft: #15301F; --warn: #E2B25A; --warn-soft: #33270F; --bad: #F08B80; --bad-soft: #3A1A17;
  --off: #A3ACBB; --off-soft: #232A35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.mono, .code { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand b { font: 700 20px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }
.proto { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; white-space: nowrap }
.scan { flex: 1 1 240px; display: flex; gap: 6px; min-width: 0 }
.scan input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font-family: var(--f-mono) }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.who select { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-width: 100% }
.tabs { max-width: 1180px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 4px; overflow-x: auto }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; display: flex; gap: 8px; align-items: center }
.tab[aria-current="page"] { color: var(--ink); border-color: var(--accent) }
.tab.pend { opacity: .7 }
.tabs.sub { padding-top: 2px; border-top: 1px solid var(--line) }
.tabs.sub .tab { font-size: 13px; padding: 7px 10px 8px }
.tabs[hidden] { display: none }
.mapa { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); align-items: start }
.mapa .card { margin: 0 }
.mapa .grupo-head { flex-wrap: nowrap; align-items: flex-start }
.procs { list-style: none; margin: 10px 0 0; padding: 0 }
.procs li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line) }
.link.quiet { color: var(--muted) }
.link.plain { color: inherit; text-decoration: none; font: inherit }
.permisos tr.grupo td { background: var(--surface-2); padding-top: 10px }
.permisos .si { color: var(--ok); font-weight: 700 }
.tab .n { font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 0 7px; color: var(--muted) }
.tab .step { font: 600 11px/1 var(--f-mono); color: var(--muted) }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; display: grid; gap: 18px }

/* Piezas comunes */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.link.mono { white-space: nowrap }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.card h2 { font: 600 15px/1.3 var(--f-body); margin-bottom: 4px }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.plain::before { display: none }
.s-info { color: var(--accent); background: var(--accent-soft) }
.s-ok { color: var(--ok); background: var(--ok-soft) }
.s-warn { color: var(--warn); background: var(--warn-soft) }
.s-bad { color: var(--bad); background: var(--bad-soft) }
.s-off { color: var(--off); background: var(--off-soft) }
.note { font-size: 13px; color: var(--muted) }
.banner { border-radius: var(--r); padding: 10px 14px; font-size: 13px; margin: 0 }
.banner.warn { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn) }
.banner.bad { background: var(--bad-soft); color: var(--ink); border-left: 3px solid var(--bad) }
.banner.ok { background: var(--ok-soft); color: var(--ink); border-left: 3px solid var(--ok) }
.banner.info { background: var(--accent-soft); color: var(--ink); border-left: 3px solid var(--accent) }

.tablewrap { overflow-x: auto; margin-inline: -4px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--surface-2) }
tr.off td { color: var(--muted) }
.neg { color: var(--bad) } .pos { color: var(--warn) } .zero { color: var(--ok) }

.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between }
.page-head h1 { font: 700 30px/1.05 var(--f-display); letter-spacing: .01em }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch }
.counts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.empty { text-align: center; padding: 34px 18px; display: grid; gap: 10px; justify-items: center }
.empty h2 { font: 700 22px/1.1 var(--f-display) }
.empty p { margin: 0; color: var(--muted); max-width: 52ch }

/* Formularios */
.form { display: grid; gap: 14px }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field label, .field .lbl { font-size: 12px; font-weight: 500; color: var(--muted) }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.field .hint { font-size: 12px; color: var(--muted) }
.field .big { font: 500 26px/1.1 var(--f-mono); padding: 10px 12px; letter-spacing: .02em }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; width: max-content; max-width: 100% }
.seg button { border: 0; background: var(--surface); padding: 9px 18px; cursor: pointer; font-weight: 500 }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.colores td { padding: 6px 6px }
.colores input, .colores select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg) }
.colores input.up { text-transform: uppercase; font-family: var(--f-mono) }
.colores .w-color { min-width: 150px } .colores .w-cod { min-width: 140px } .colores .w-abr { min-width: 96px; width: 110px } .colores .w-prev { min-width: 170px }
.form-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.art { min-width: 170px }
.grupo-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 8px }
.grupo-head h2 { font: 700 22px/1.1 var(--f-display); margin: 0 }
.lock { font-size: 11px; color: var(--muted) }

/* Recepción */
.rec-head { display: grid; gap: 14px }
.rec-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.rec-title h1 { font: 700 34px/1 var(--f-display); letter-spacing: .01em }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 20px; margin: 0 }
.facts div { min-width: 0 }
.facts dt { font-size: 12px; color: var(--muted) }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px }
.steps li { border-top: 4px solid var(--line); padding-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.3 }
.steps li.done { border-color: var(--ok); color: var(--ink) }
.steps li.now { border-color: var(--accent); color: var(--ink); font-weight: 600 }
.steps small { display: block; font-weight: 400; color: var(--muted) }
.next { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px }
.next p { margin: 0; min-width: 0; flex: 1 1 280px }
.next .acts { display: flex; flex-wrap: wrap; gap: 8px }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start }
.next-code { font-size: 13px; color: var(--muted) }
.next-code b { font-family: var(--f-mono); color: var(--ink); font-weight: 500 }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 60px }
.bar i { display: block; height: 100%; background: var(--accent) }
.bar i.full { background: var(--ok) }
.decide { display: grid; gap: 12px }
.decide textarea { min-height: 70px; resize: vertical }
.acts-row { display: flex; flex-wrap: wrap; gap: 8px }
.tiempos tr.total td { font-weight: 600; border-top: 2px solid var(--line) }
.tiempos .curso { color: var(--accent); font-weight: 500 }

/* Etiqueta 100 x 150 mm */
.label {
  width: 100%; max-width: 300px; aspect-ratio: 100 / 150; background: var(--paper); color: var(--paper-ink);
  border: 1px solid #c9ccd1; border-radius: 3px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px;
  font-family: var(--f-body); box-shadow: var(--shadow); container-type: inline-size;
}
.label .l-top { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--paper-ink); padding-bottom: 5px; gap: 6px }
.label .l-code { font: 700 clamp(18px, 10.5cqi, 31px)/1 var(--f-display); letter-spacing: .01em; text-align: center; white-space: nowrap }
.label .l-qr { flex: 1; display: grid; place-items: center; min-height: 0 }
.label .l-qr svg { width: auto; height: 100%; max-height: 170px; max-width: 100%; display: block }
.label .l-art { font-size: 11px; line-height: 1.25; border-top: 2px solid var(--paper-ink); padding-top: 6px }
.label .l-art b { font-family: var(--f-mono); font-size: 12px }
.label .l-kg { display: flex; justify-content: space-between; align-items: baseline; gap: 6px }
.label .l-kg span { font-size: 9px; letter-spacing: .08em; text-transform: uppercase }
.label .l-kg strong { font: 700 clamp(22px, 13cqi, 38px)/1 var(--f-display) }
.label .l-foot { display: flex; justify-content: space-between; font-size: 10px; border-top: 1px solid var(--paper-ink); padding-top: 5px; gap: 6px }

/* Etiqueta de ubicación (anaquel o muelle), mismo papel 100 x 150 mm */
.label.ubi { gap: 6px; text-align: center }
.label.ubi .u-tipo { font: 700 clamp(14px, 8cqi, 22px)/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase }
.label.ubi .u-code { font: 700 clamp(22px, 15cqi, 44px)/1 var(--f-display); letter-spacing: .02em; white-space: nowrap }
.label.ubi .u-partes { display: flex; justify-content: space-around; border-top: 2px solid var(--paper-ink); padding-top: 6px; gap: 4px }
.label.ubi .u-partes div { display: grid; line-height: 1 }
.label.ubi .u-partes span { font-size: 8px; letter-spacing: .08em; text-transform: uppercase }
.label.ubi .u-partes b { font: 700 clamp(20px, 13cqi, 38px)/1 var(--f-display) }

/* Pasillos y racks plegables */
.fold { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; min-width: 0 }
.fold .chev { display: inline-block; width: 18px; font-size: 14px; color: var(--muted); transition: transform .15s }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg) }
.fold .fold-t { display: block; font: 700 22px/1.1 var(--f-display) }
.fold.chico .fold-t { font-size: 17px }
.fold .fold-r { display: block }
.fold:hover .fold-t { color: var(--accent) }
.fold:disabled { cursor: default; color: inherit } .fold:disabled:hover .fold-t { color: inherit }
.racks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-top: 10px; padding-left: 28px; border-left: 2px solid var(--line); margin-left: 8px }
.rack { min-width: 0 }
.rack + .rack { border-top: 1px solid var(--line); padding-top: 6px }
@media (max-width: 640px) { .racks { padding-left: 12px; margin-left: 4px } }

tr.hit td { background: var(--accent-soft) }
#aj-rollo::placeholder, [data-ajn]::placeholder { text-transform: none }
.sec-t { font: 700 17px/1.2 var(--f-display); margin: 6px 0 -8px }
#art-buscar, #ex-buscar { padding: 10px 14px; font-family: var(--f-body) }
.exist { background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: right; display: inline-flex; flex-direction: column; align-items: flex-end; color: inherit; font: inherit }
.exist b { font-weight: 700; font-size: 15px }
.exist:hover b { color: var(--accent) }
.exist .chev { display: inline-block; transition: transform .15s }
.exist[aria-expanded="true"] .chev { transform: rotate(90deg) }
.anaq-tabla { margin: 4px 0 8px; max-width: 560px }
tr.sub > td { background: var(--surface-2, transparent); padding-top: 0 }
.rollos-lista { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px }
.rollo-chip { border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; background: var(--surface); cursor: pointer; font-size: 13px; text-align: left }
.rollo-chip.hit { border-color: var(--accent); background: var(--accent-soft) }

/* Ventana */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.55); z-index: 40; display: grid; place-items: center; padding: 16px; overflow-y: auto }
.dialog { background: var(--surface); border-radius: 12px; max-width: 760px; width: 100%; padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow); max-height: calc(100vh - 32px); overflow-y: auto }
.dialog-head { display: flex; justify-content: space-between; gap: 12px; align-items: start }
.dialog-head h2 { font: 700 24px/1.1 var(--f-display) }
.label-view { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start }
.cedula { white-space: pre-wrap; background: var(--surface-2); border-radius: var(--r); padding: 10px 12px; font: 13px/1.5 var(--f-mono); margin: 6px 0 12px; overflow-wrap: anywhere }
.stack { display: grid; gap: 10px; min-width: 0 }
.lote { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; justify-items: center }
.lote .label { box-shadow: none }
@media (max-width: 640px) { .label-view { grid-template-columns: minmax(0, 1fr) } .label { margin: 0 auto } .steps { grid-template-columns: repeat(6, minmax(56px, 1fr)); overflow-x: auto } }

.ficha { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); align-items: start }
@media (max-width: 760px) { .ficha { grid-template-columns: minmax(0, 1fr) } }
.events td:first-child { white-space: nowrap; color: var(--muted) }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(560px, calc(100% - 32px)); padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--shadow) }
.toast.error { background: var(--bad); color: #fff }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Sistema para telas</b><span class="proto">Prototipo</span></div>
    <form class="scan" id="scan-form" role="search">
      <input id="scan" placeholder="Escanea o escribe un código de rollo" aria-label="Código de rollo" autocomplete="off">
      <button class="btn" type="submit">Abrir</button>
    </form>
    <label class="who" for="user">Viendo como
      <select id="user"></select>
    </label>
  </div>
  <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
  <nav class="tabs sub" id="subtabs" aria-label="Procesos del módulo"></nav>
</header>

<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- Personas y permisos de ejemplo
const TODOS = ["catalogo.ver", "catalogo.editar", "recepcion.ver", "recepcion.crear", "recepcion.registrar_pieza", "recepcion.verificar", "recepcion.aprobar", "recepcion.anular", "pieza.liberar", "pieza.resolver_incidencia", "pieza.ubicar", "compra.crear", "etiqueta.imprimir", "ajuste.crear", "ajuste.aprobar", "ajuste.motivos", "traslado.crear", "traslado.aprobar", "traslado.recibir"];
const USERS = {
  admin:  { nombre: "Administrador", rol: "Administrador de empresa", permisos: TODOS },
  ana:    { nombre: "Ana Pérez",  rol: "Gerente de recepción"   , permisos: ["catalogo.ver", "recepcion.ver", "recepcion.crear", "recepcion.registrar_pieza", "recepcion.verificar", "pieza.ubicar", "etiqueta.imprimir", "ajuste.crear", "traslado.crear", "traslado.recibir"] },

// Búsqueda rápida: por texto (todas las palabras deben aparecer) o por escáner. Una etiqueta de rollo lleva su código
// (AAAAMMDD-ABR-NNN) en la primera línea; de ahí sale la abreviatura y con ella el artículo.
function buscarArticulos(q) {
  const n = t => sinAcentos(String(t || "")).toLowerCase();
  const txt = String(q).trim().split(/\n/)[0].trim();
  if (!txt) return { lista: D.articulos, exacto: null, nota: "" };
  const up = txt.toUpperCase();
  const rollo = /^\d{8}-([A-Z0-9]+)-\d+$/.exec(up), porRollo = rollo && D.articulos.find(a => a.abr === rollo[1]);
  const exacto = porRollo || D.articulos.find(a => a.codigo === up || a.abr === up);
  if (exacto) {
    const p = rollo && D.piezas.find(x => x.codigo === up);
    return { lista: [exacto], exacto: exacto.id, nota: rollo ? `El rollo ${esc(up)} es del artículo ${esc(exacto.codigo)}${p ? ` · ${EST_PIEZA[p.estado][0].toLowerCase()}${p.estado === "disponible" ? ` en ${esc(p.ubic)}` : ""}` : " · ese rollo todavía no está registrado"}.` : `Artículo ${esc(exacto.codigo)}.` };
  }
  const palabras = n(txt).split(/\s+/);
  const lista = D.articulos.filter(a => { const h = n(`${a.codigo} ${a.abr} ${lineaDe(a)} ${a.categoria} ${a.color} ${a.comp}`); return palabras.every(w => h.includes(w)) });
  return { lista, exacto: lista.length === 1 ? lista[0].id : null,
           nota: lista.length ? `${lista.length} de ${D.articulos.length} artículos coinciden con “${esc(txt)}”.` : `Ningún artículo coincide con “${esc(txt)}”. Prueba con otra palabra o con el código.` };
}

function refrescarSugerencias() {
  const f = S.artForm; if (!f) return;
  const pref = prefijoCategoria(f.linea, f.categoria), ocupados = f.filas.filter(x => x.codTocado).map(x => x.codigo.trim().toUpperCase());
  f.filas.forEach((x, i) => {
    if (x.codTocado) return;
    x.codigo = x.color.trim() && pref ? codigoLibre(pref, ocupados) : "";
    if (x.codigo) ocupados.push(x.codigo);
    const el = document.querySelector(`[data-row="${i}"][data-col="codigo"]`); if (el) el.value = x.codigo;
  });
  f.filas.forEach((x, i) => {
    if (!x.abrTocada) {
      x.abr = sugerirAbr(nombreTela(f.linea, f.categoria), x.color, i);
      const el = document.querySelector(`[data-row="${i}"][data-col="abr"]`); if (el) el.value = x.abr;
    }
    const pv = document.getElementById(`prev-${i}`); if (pv) pv.textContent = x.abr ? `${ymd(hoyISO())}-${x.abr}-001` : "";
  });
}

function siguienteCodigo(fecha, abr, consumir) {
  const k = ymd(fecha) + abr, n = (D.contador[k] || 0) + 1;
  if (consumir) D.contador[k] = n;
  return `${ymd(fecha)}-${abr}-${n < 1000 ? String(n).padStart(3, "0") : n}`;
}
// Tiempos: cada etapa guarda cuándo terminó y quién la cerró. Se calculan duraciones, nunca se editan.
function marcar(r, k) { (r.t ||= {})[k] = { ms: Date.now(), por: S.user } }
function evento(p, tipo, de, a, nota) { p.eventos.push({ hora: hoy(), tipo, de, a, quien: S.user, nota: nota || "" }) }

function cuadre(r) {
  const ps = piezasDe(r);
  const lineas = r.lineas.map(l => {
    const a = art(l.art), vivas = ps.filter(p => p.art === l.art && p.estado !== "anulada");
    const recibido = Math.round(vivas.reduce((s, p) => s + p.cantidad, 0) * 100) / 100;
    const dif = Math.round((recibido - l.esperado) * 100) / 100;
    return { ...l, a, un: a.un, recibido, dif, pct: Math.round(dif * 10000 / l.esperado) / 100,
             registradas: vivas.length, anuladas: ps.filter(p => p.art === l.art && p.estado === "anulada").length,
             conIncidencia: vivas.filter(p => p.estado === "pendiente_autorizacion").length };
  });
  return { lineas, hayDif: lineas.some(l => l.dif !== 0 || (l.rollos && l.registradas !== l.rollos)),
           abiertas: r.incidencias.filter(i => i.abierta).length,
           registradas: lineas.reduce((s, l) => s + l.registradas, 0), rollos: lineas.reduce((s, l) => s + (l.rollos || 0), 0) };
}

function abrirFormRecepcion() {
  const abiertas = ocsAbiertas();
  S.recForm = { oc: "", prov: "", docTipo: "Factura", docNum: "", fecha: hoyISO(), muelle: ubisActivas("muelle")[0]?.codigo || "", contenedor: "", lineas: [] };
  if (abiertas.length === 1) cargarOC(abiertas[0].id);
}
// Al elegir la orden se copian sus artículos con lo pendiente; el gerente de recepción corrige según la factura del contenedor.
function cargarOC(id) {
  const f = S.recForm, o = ocById(id);
  f.oc = o ? o.id : ""; f.prov = o ? o.prov : "";
  f.lineas = o ? avanceOC(o).lineas.filter(l => l.pendiente > 0).map(l => ({ art: l.art, cant: n2(l.pendiente).replace(/\./g, ""), rollos: l.rollos && !l.rollosRec ? String(l.rollos) : "" })) : [];
}
const ACC = {
  crearRecepcion() {

    const f = S.recForm;
    const o = ocById(f.oc);
    if (!o) throw new Regla("Elige la orden de compra de esta mercancía.");
    if (!["abierta", "parcial"].includes(avanceOC(o).estado)) throw new Regla(`La orden ${o.numero} ya no admite recepciones.`);
    if (f.contenedor.trim() && !/^[A-Za-z0-9 -]{4,20}$/.test(f.contenedor.trim())) throw new Regla("El número de contenedor lleva letras y números, por ejemplo MSCU 123456-7.");

    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.fecha)) throw new Regla("Indica la fecha de recepción.");
    if (!ubisActivas("muelle").some(x => x.codigo === f.muelle)) throw new Regla("Elige el muelle donde se descarga el contenedor.");
    const lineas = f.lineas.filter(l => l.art || l.cant.trim() || l.rollos.trim());
    if (!lineas.length) throw new Regla("Agrega al menos un artículo facturado.");
    const vistos = new Set();
    const ok = lineas.map((l, i) => {
      const a = art(l.art);
      if (!a) throw new Regla(`Línea ${i + 1}: elige el artículo.`);
      if (vistos.has(a.id)) throw new Regla(`${a.codigo} está repetido. Pon cada artículo una sola vez con su total.`);
      if (!o.lineas.some(x => x.art === a.id)) throw new Regla(`${a.codigo} no está en la orden ${o.numero}. Solo se recibe lo que se pidió.`);
      vistos.add(a.id);
      const c = decimal(l.cant);
      if (!(c > 0)) throw new Regla(`Línea ${i + 1}: escribe la cantidad facturada en ${UN[a.un].corto}, con hasta 2 decimales.`);

      if (l.rollos.trim() && !(Number.isInteger(ro) && ro > 0)) throw new Regla(`Línea ${i + 1}: los rollos facturados son un número entero.`);
      return { art: a.id, esperado: c, rollos: ro, pedido: avanceOC(o).lineas.find(x => x.art === a.id).pendiente };
    });
    const r = { id: "r" + (++D.sec.rec), numero: `REC-${String(D.sec.rec).padStart(6, "0")}`, oc: o.id, prov: o.prov, doc: `${f.docTipo} ${f.docNum.trim()}`,
                fecha: f.fecha, muelle: f.muelle, contenedor: f.contenedor.trim().toUpperCase(), estado: "en_preparacion", responsable: S.user, verificadoPor: null, lineas: ok, incidencias: [], decision: null, t: {} };
    marcar(r, "inicio");
    D.recs.push(r);
    S.recForm = null; S.view = "recepcion"; S.rec = r.id; S.form.art = ok[0].art;
    return `Recepción ${r.numero} abierta. Ya puedes registrar los rollos.`;
  },
  registrar(r) {

    const f = S.form, a = art(f.art);
    if (!a || !r.lineas.some(l => l.art === a.id)) throw new Regla("Elige uno de los artículos de esta recepción.");
    const c = decimal(f.peso), U = UN[a.un];

    if (c > a.tope) throw new Regla(`El valor ${cant(c, a.un)} supera el tope de ${cant(a.tope, a.un)} configurado para ${a.abr}. Revisa la cifra.`);
    let fab = null;

    const p = { codigo: siguienteCodigo(r.fecha, a.abr, true), art: a.id, un: a.un, rec: r.id, cantidad: c, actual: c, fab,
                estado: "en_cuarentena", ubic: r.muelle, por: S.user, impresiones: 0, eventos: [] };
    evento(p, "registrada", null, "en_cuarentena");
    D.piezas.push(p); a.usada = true;
    S.form.peso = ""; S.form.fab = "";
    return `Rollo ${p.codigo} guardado (${cant(c, a.un)}). Escribe el siguiente.`;
  },
  imprimirLote(r) {
    exigir("etiqueta.imprimir");
    const pend = pendientesDeImprimir(r);
    if (!pend.length) throw new Regla("No hay etiquetas pendientes de imprimir.");
    pend.forEach(p => { p.impresiones = 1; evento(p, "etiqueta", null, null, "Primera impresión, en lote") });
    return `${pend.length} ${pend.length === 1 ? "etiqueta enviada" : "etiquetas enviadas"} a la impresora en orden de código. En el prototipo no salen a la impresora.`;
  },
  imprimir(p) {
    exigir("etiqueta.imprimir");
    p.impresiones++;
    evento(p, "etiqueta", null, null, p.impresiones === 1 ? "Primera impresión" : `Reimpresión n.º ${p.impresiones - 1}`);
    return p.impresiones === 1 ? "Impresión registrada. En el prototipo no sale a la impresora." : `Reimpresión n.º ${p.impresiones - 1} registrada en el historial.`;

    if (!piezasDe(r).some(p => p.estado !== "anulada")) throw new Regla("La recepción no tiene rollos registrados.");

  },
  enviar(r) {
    exigir("recepcion.verificar");

    r.estado = "pendiente_autorizacion"; r.verificadoPor = S.user; marcar(r, "enviado");

      if (decision === "aprobada" && p.estado === "en_cuarentena") evento(p, "aprobada", p.estado, p.estado, motivo);
      if (decision === "rechazada" && ["en_cuarentena", "pendiente_autorizacion"].includes(p.estado)) { evento(p, "rechazada", p.estado, "rechazada", motivo); p.estado = "rechazada" }
    }

    return decision === "aprobada" ? "Recepción aprobada. Los rollos siguen en cuarentena hasta que alguien los libere." : "Recepción rechazada. Sus rollos quedan rechazados y sus códigos no se reutilizan.";

    if (!objetivo.length) throw new Regla("Marca al menos un rollo en cuarentena para liberarlo.");
    objetivo.forEach(p => { p.estado = "liberada"; evento(p, "liberada", "en_cuarentena", "liberada"); delete S.sel[p.codigo] });
    intentarCerrar(r);
    return `${objetivo.length} ${objetivo.length === 1 ? "rollo liberado" : "rollos liberados"} de cuarentena.${r.estado === "por_ubicar" ? " Ahora se trasladan del muelle a los anaqueles; hasta entonces no se pueden vender." : r.estado === "cerrada" ? " La recepción quedó cerrada." : ""}`;

    evento(p, "incidencia_resuelta", p.estado, a, aceptar ? "Se acepta con la incidencia anotada" : "Se rechaza el rollo");
    p.estado = a; inc.abierta = false; inc.resolucion = aceptar ? "Aceptado" : "Rechazado"; inc.resueltoPor = S.user;
    intentarCerrar(r);

    const x = ubiPorCodigo(codAnaquel || "");

    if (x.tipo !== "anaquel") throw new Regla(`${x.codigo} es un muelle. Los rollos se trasladan del muelle a un anaquel.`);
    if (!x.activo) throw new Regla(`El anaquel ${x.codigo} está desactivado.`);
    if (x.alm !== almDe(r.muelle)) throw new Regla(`${x.codigo} es del ${nombreAlm(x.alm)}. Esta recepción se descargó en el ${nombreAlm(almDe(r.muelle))}; para llevar rollos a otro almacén usa un traslado.`);

    if (p.estado !== "liberada") throw new Regla(`El rollo ${q} está ${EST_PIEZA[p.estado][0].toLowerCase()}: no se traslada.`);

    p.ubic = x.codigo; p.estado = "disponible"; S.ubi.rollo = "";

    intentarCerrar(r);
    const faltan = piezasDe(r).filter(z => z.estado === "liberada").length;
    return faltan ? `${q} trasladado a ${x.codigo}. Disponible para venta. Faltan ${faltan}.` : `${q} trasladado a ${x.codigo}. Era el último: recepción cerrada en ${dur(r.t.ubicado.ms - r.t.inicio.ms)} en total.`;

  },

function pendientesDeImprimir(r) {
  return piezasDe(r).filter(p => !p.impresiones && ["en_cuarentena", "pendiente_autorizacion"].includes(p.estado))
                    .sort((x, y) => x.codigo.localeCompare(y.codigo, "es", { numeric: true }));
}
function intentarCerrar(r) {
  const ps = piezasDe(r);
  if (r.estado === "verificada" && !ps.some(p => ["en_cuarentena", "pendiente_autorizacion"].includes(p.estado))) { r.estado = "por_ubicar"; marcar(r, "liberado") }
  if (r.estado === "por_ubicar" && !ps.some(p => p.estado === "liberada")) { r.estado = "cerrada"; marcar(r, "ubicado") }
}

const pillRec = e => `<span class="pill ${EST_REC[e][1]}">${EST_REC[e][0]}</span>`;

  return `
  <section class="page-head">

          <td>${pillRec(r.estado)}</td><td class="note">${EST_REC[r.estado][2]}</td><td class="num">${tiempoTotal(r)}</td></tr>` }).join("")}
      </tbody></table></div></section>` : ""}`;
}

}
function formRecepcion() {

        <div class="field"><label for="rf-cont">Contenedor (opcional)</label><input id="rf-cont" class="mono" data-rf="contenedor" value="${esc(f.contenedor)}" placeholder="Ej. MSCU 123456-7" autocomplete="off" style="text-transform:uppercase"><span class="hint">Déjalo vacío si la mercancía no llega en contenedor.</span></div>
        <div class="field"><label for="rf-fecha">Fecha de recepción</label><input id="rf-fecha" type="date" data-rf="fecha" value="${f.fecha}"><span class="hint">Va dentro del código de cada rollo.</span></div>

      </div>

          <td style="min-width:240px"><select data-rl="${i}" data-col="art" aria-label="Artículo, línea ${i + 1}">${opcionesArticulo(l.art, ocById(f.oc)?.lineas.map(x => x.art))}</select></td>

          <td style="min-width:110px"><input data-rl="${i}" data-col="rollos" inputmode="numeric" value="${esc(l.rollos)}" placeholder="Ej. 10" aria-label="Rollos, línea ${i + 1}"></td>

function pasos(r) {
  const orden = ["en_preparacion", "pendiente_verificacion", "pendiente_autorizacion", "verificada", "por_ubicar", "cerrada"];
  const nombres = [["Registro", "Cada rollo"], ["Verificación", "Gerente de recepción"], ["Gerente", "Aprueba con el cuadre"], ["Liberación", "Persona autorizada"], ["Traslado", "Del muelle al anaquel"], ["Cerrada", "Disponible para venta"]];
  const i = orden.indexOf(r.estado);
  if (i < 0) return "";
  return `<ol class="steps" aria-label="Etapas de la recepción">${nombres.map((n, k) =>
    `<li class="${k < i || r.estado === "cerrada" ? "done" : k === i ? "now" : ""}">${n[0]}<small>${n[1]}</small></li>`).join("")}</ol>`;
}
function siguiente(r) {
  const c = cuadre(r), sin = t => `<span class="note">${t}</span>`;
  switch (r.estado) {
    case "en_preparacion": { const pend = pendientesDeImprimir(r).length; return `<div class="next"><p><b>Registra todos los rollos de corrido.</b> Llevas ${c.registradas}${c.rollos ? ` de ${c.rollos}` : ""}.${pend ? ` Cuando termines, imprime las ${pend} etiquetas de una vez y pégalas.` : ""} Después cierra el registro para revisar el cuadre.</p>

    case "pendiente_verificacion": return `<div class="next"><p><b>Revisa el cuadre y envíalo al gerente.</b> Toda recepción pasa por el gerente, cuadre o no. Quien la envíe no podrá aprobarla.</p>
      <div class="acts">${puede("recepcion.verificar") ? `<button class="btn primary" data-act="enviar">Enviar al gerente</button>` : sin("La envía el gerente de recepción.")}</div></div>`;
    case "pendiente_autorizacion": return `<div class="next"><p><b>Esperando la decisión del gerente.</b> Enviada por ${quien(r.verificadoPor)}. ${c.hayDif ? "El cuadre tiene diferencias: aprobar exige escribir el motivo." : "El cuadre coincide."}</p>
      <div class="acts">${puede("recepcion.aprobar") ? `<a class="btn primary" href="#decision" data-act="ir-a" data-to="decision">Ir a la decisión</a>` : sin("Decide el gerente.")}</div></div>`;
    case "verificada": return `<div class="next"><p><b>Aprobada por ${quien(r.decision?.por)}.</b> Los rollos siguen en cuarentena: no se venden ni se separan hasta que una persona autorizada los libere.</p>
      <div class="acts">${puede("pieza.liberar") ? `<a class="btn primary" href="#liberar" data-act="ir-a" data-to="liberar">Ir a liberar</a>` : sin("Libera el gerente.")}</div></div>`;
    case "por_ubicar": { const ps = piezasDe(r), hechos = ps.filter(p => p.estado === "disponible").length, total = hechos + ps.filter(p => p.estado === "liberada").length;
      return `<div class="next"><p><b>Traslada cada rollo del muelle a su anaquel.</b> Llevas ${hechos} de ${total}. Están liberados pero siguen en el muelle ${esc(muelleDe(r))} y no se venden hasta trasladarlos. Al trasladar el último, la recepción se cierra.</p>
      <div class="acts">${puede("pieza.ubicar") ? `<a class="btn primary" href="#ubicar" data-act="ir-a" data-to="ubicar">Ir a trasladar</a>` : sin("Traslada el personal de almacén.")}</div></div>` }
    case "cerrada": return `<div class="banner ok">Recepción cerrada${r.t?.ubicado && r.t?.inicio ? ` en ${dur(r.t.ubicado.ms - r.t.inicio.ms)}, desde que se abrió hasta el último traslado` : ""}. Aprobada por ${quien(r.decision?.por)} el ${r.decision?.hora}. Sus rollos están en sus anaqueles y disponibles para la venta.</div>`;
    case "rechazada": return `<div class="banner bad">Rechazada por ${quien(r.decision?.por)}: ${esc(r.decision?.motivo)}. Los rollos quedan rechazados y sus códigos no se reutilizan.</div>`;
  }
  return "";
}
function tablaCuadre(r) {

    <h2>Cuadre de recepción</h2>
    <p class="sub">Lo pedido, lo facturado y lo recibido, por artículo y en su unidad. Sin tolerancia: cualquier diferencia se muestra y la decide el gerente.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Artículo</th>${r.oc ? `<th class="num">Pedido pendiente</th>` : ""}<th class="num">Facturado</th><th class="num">Recibido</th><th class="num">Diferencia</th><th class="num">%</th><th>Rollos</th></tr></thead>
      <tbody>${c.lineas.map(l => `<tr>

        ${r.oc ? `<td class="num">${l.pedido != null ? cant(l.pedido, l.un) : "—"}${l.pedido != null && l.pedido !== l.esperado ? `<br><span class="note pos">${l.esperado < l.pedido ? `${cant(r2(l.pedido - l.esperado), l.un)} siguen pendientes` : `${cant(r2(l.esperado - l.pedido), l.un)} más de lo pedido`}</span>` : ""}</td>` : ""}
        <td class="num">${cant(l.esperado, l.un)}</td><td class="num">${cant(l.recibido, l.un)}</td>
        <td class="num ${difCls(l.dif)}">${signo(l.dif)} ${UN[l.un].corto}</td><td class="num ${difCls(l.dif)}">${(l.pct > 0 ? "+" : "") + String(l.pct).replace(".", ",")}</td>
        <td>${l.rollos ? `<div style="display:flex;align-items:center;gap:8px"><span class="num ${l.registradas === l.rollos ? "" : "pos"}">${l.registradas}/${l.rollos}</span>
          <div class="bar" style="flex:1"><i class="${l.registradas >= l.rollos ? "full" : ""}" style="width:${Math.min(100, l.registradas * 100 / l.rollos)}%"></i></div></div>` : `<span class="num">${l.registradas}</span>`}</td></tr>`).join("")}

  </div>`;
}

      </div>
      <p class="note" style="margin:0">El dato no se reparte entre rollos ni se corrige después: si te equivocas, el gerente anula el rollo y se registra de nuevo con otro código.</p>

function panelDecision(r) {

      <div><h2>${liberar ? "Liberar rollos" : "Rollos registrados"}</h2>

// ---------------------------------------------------------------- Módulo 8 · Traslados entre almacenes
// El rollo sale del anaquel de origen al aprobarse el traslado, viaja "en tránsito" y vuelve a estar disponible
// solo cuando alguien del almacén de destino lo escanea en su nuevo anaquel. Así se sabe si algo se pierde en el camino.
const EST_TRA = { por_aprobar: ["Por aprobar", "s-warn"], en_transito: ["En tránsito", "s-info"], recibido: ["Recibido completo", "s-ok"], rechazado: ["Rechazado", "s-bad"] };
function traById(id) { return D.traslados.find(x => x.id === id) }
function almDePieza(p) { return p.estado === "en_transito" && p.tras ? traById(p.tras).destino : almDe(p.ubic) }
function docPendienteDe(cod) {
  return D.ajustes.find(x => x.estado === "pendiente" && x.lineas.some(l => l.cod === cod)) || D.traslados.find(x => x.estado === "por_aprobar" && x.lineas.some(l => l.cod === cod));
}
function abrirFormTraslado() { const o = ALMACENES[0].id; S.traForm = { origen: o, destino: ALMACENES.find(a => a.id !== o).id, nota: "", rollo: "", lineas: [] } }
const ACC_TRA = {
  agregar() {
    const f = S.traForm, cod = String(f.rollo || "").trim().split(/\n/)[0].trim().toUpperCase(), p = D.piezas.find(x => x.codigo === cod);
    if (!cod) throw new Regla("Escanea o escribe el código del rollo.");
    if (!p) throw new Regla(`No existe el rollo ${cod}.`);
    if (p.estado !== "disponible") throw new Regla(`El rollo ${cod} está ${EST_PIEZA[p.estado][0].toLowerCase()}: solo se trasladan rollos ubicados en su anaquel.`);
    if (almDe(p.ubic) !== f.origen) throw new Regla(`El rollo ${cod} está en el ${nombreAlm(almDe(p.ubic))}, no en el ${nombreAlm(f.origen)}.`);
    const otro = docPendienteDe(cod); if (otro) throw new Regla(`El rollo ${cod} ya está en el ${otro.numero}, por aprobar.`);
    if (f.lineas.includes(cod)) throw new Regla(`${cod} ya está en este traslado.`);
    f.lineas.push(cod); f.rollo = "";
  },
  guardar() {
    exigir("traslado.crear");
    const f = S.traForm;
    if (f.origen === f.destino) throw new Regla("El almacén de destino debe ser distinto del de origen.");
    if (!f.lineas.length) throw new Regla("Escanea al menos un rollo.");
    const t = { id: "t" + (D.traslados.length + 1), numero: `TRA-${String(++D.sec.tra).padStart(6, "0")}`, origen: f.origen, destino: f.destino, nota: f.nota.trim(),
                fecha: hoyISO(), hora: hoy(), por: S.user, estado: "por_aprobar",
                lineas: f.lineas.map(cod => { const p = D.piezas.find(x => x.codigo === cod); return { cod, art: p.art, cant: cantDe(p), desde: p.ubic, recibido: null } }), t: {} };
    marcar(t, "registrado");
    D.traslados.push(t); S.traForm = null;
    return `${t.numero} registrado. Los rollos siguen disponibles en el ${nombreAlm(t.origen)} hasta que un gerente lo apruebe.`;
  },
  aprobar(t) {
    exigir("traslado.aprobar");
    if (t.estado !== "por_aprobar") throw new Regla(`${t.numero} ya no está por aprobar.`);
    if (t.por === S.user) throw new Regla("Quien registra un traslado no lo aprueba. Debe aprobarlo otro gerente.");
    t.lineas.forEach(l => { const p = D.piezas.find(x => x.codigo === l.cod);
      if (p.estado !== "disponible" || p.ubic !== l.desde) throw new Regla(`${l.cod} ya no está en ${l.desde}. Rechaza el traslado y regístralo de nuevo.`) });
    t.lineas.forEach(l => { const p = D.piezas.find(x => x.codigo === l.cod);
      evento(p, "traslado_salida", "disponible", "en_transito", `${t.numero} · ${p.ubic} (${nombreAlm(t.origen)}) → ${nombreAlm(t.destino)}`);
      p.estado = "en_transito"; p.tras = t.id; l.cant = cantDe(p) });
    t.estado = "en_transito"; t.decision = { por: S.user, hora: hoy() }; marcar(t, "despachado");
    return `${t.numero} aprobado: ${t.lineas.length} ${t.lineas.length === 1 ? "rollo sale" : "rollos salen"} en tránsito hacia el ${nombreAlm(t.destino)}. Allí se escanean al llegar.`;
  },
  rechazar(t, motivo) {
    exigir("traslado.aprobar");

  },
  recibir(t, codRollo, codAnaquel) {
    exigir("traslado.recibir");
    if (t.estado !== "en_transito") throw new Regla(`${t.numero} no está en tránsito.`);
    const x = ubiPorCodigo(codAnaquel || "");
    if (!x) throw new Regla(codAnaquel?.trim() ? `No existe el anaquel ${codAnaquel.trim().toUpperCase()}.` : "Primero escanea el anaquel de destino.");
    if (x.tipo !== "anaquel" || !x.activo) throw new Regla(`${x.codigo} no es un anaquel activo.`);
    if (x.alm !== t.destino) throw new Regla(`${x.codigo} es del ${nombreAlm(x.alm)}. Este traslado va al ${nombreAlm(t.destino)}.`);
    const q = String(codRollo || "").trim().toUpperCase(), l = t.lineas.find(z => z.cod === q);
    if (!q) throw new Regla("Escanea el rollo.");
    if (!l) throw new Regla(`El rollo ${q} no viene en el ${t.numero}.`);
    if (l.recibido) throw new Regla(`El rollo ${q} ya se recibió en ${l.recibido.anaquel}.`);
    const p = D.piezas.find(z => z.codigo === q);

    p.ubic = x.codigo; p.estado = "disponible"; delete p.tras; S.traRec.rollo = "";
    l.recibido = { anaquel: x.codigo, hora: hoy(), por: S.user };

    if (!faltan) { t.estado = "recibido"; marcar(t, "recibido") }
    return faltan ? `${q} recibido en ${x.codigo}. Faltan ${faltan}.` : `${q} recibido en ${x.codigo}. Era el último: ${t.numero} recibido completo en ${duracion(t.t.despachado.ms, t.t.recibido.ms)} desde que salió.`;
  },
};
function duracion(a, b) { const s = Math.max(0, Math.round((b - a) / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s` }

    case "af-cancelar": S.artForm = null; return render();
    case "prov-nuevo": S.provForm = { codigo: "", nombre: "", fiscal: "", pais: "" }; render(); document.getElementById("pf-codigo")?.focus(); return;
    case "prov-cancelar": S.provForm = null; return render();
    case "ubi-nuevo": S.ubiForm = { tipo: el.dataset.tipo || "anaquel", codigo: "", desc: "", pasillo: "1", rack: "1", divs: "3" }; render(); document.getElementById("uf-codigo")?.focus(); return;
    case "uf-tipo": S.ubiForm.tipo = el.dataset.tipo; render(); document.getElementById(S.ubiForm.tipo === "muelle" ? "uf-codigo" : "uf-pasillo")?.focus(); return;
    case "fold": UI.abiertos[el.dataset.k] = !abierto(el.dataset.k); guardarUI(); return render();
    case "fold-todo": { const abrir = el.dataset.abrir === "1", art = el.dataset.scope === "art";
      const deArt = k => k.startsWith("tela-") || k.startsWith("linea-");
      Object.keys(UI.abiertos).filter(k => art === deArt(k)).forEach(k => delete UI.abiertos[k]);
      if (abrir && art) { const vistas = new Set(); D.articulos.forEach(a => { [["linea", lineaDe(a)], ["tela", a.tela]].forEach(([n, v]) => { if (!vistas.has(n + v)) { vistas.add(n + v); UI.abiertos[`${n}-${a.id}`] = true } }) }) }
      if (abrir && !art) { ALMACENES.forEach(a => { UI.abiertos[kAlm(a.id, "muelles")] = true }); D.ubicaciones.filter(x => x.pasillo).forEach(x => { UI.abiertos[kAlm(x.alm, `p${x.pasillo}`)] = true; UI.abiertos[kAlm(x.alm, `p${x.pasillo}-r${x.rack}`)] = true }) }
      guardarUI(); return render() }
    case "ubi-etq": abrirEtiquetasUbi(el.dataset.cods.split(" "), el.dataset.tit); return render();
    case "ubi-etq-ok": return hacer(() => { const msg = ACC_ETQ.imprimir(S.modal.codigos); S.modal = null; return msg });
    case "ubi-cancelar": S.ubiForm = null; return render();
    case "ubi-activar": return hacer(() => ACC_UBI.activar(D.ubicaciones.find(x => x.id === el.dataset.id)));
    case "ubicar-fila": hacer(() => ACC.ubicar(r, el.dataset.cod, S.ubi.anaquel)); return listoParaUbicar();
    case "oc-nueva": abrirFormOC(); return render();
    case "of-linea": S.ocForm.lineas.push({ art: "", cant: "", rollos: "" }); return render();
    case "of-quitar": S.ocForm.lineas.splice(+el.dataset.row, 1); return render();
    case "of-cancelar": S.ocForm = null; return render();
    case "oc-anular": return hacer(() => ACC_OC.anular(ocById(el.dataset.id)));
    case "rec-nueva": abrirFormRecepcion(); return render();
    case "rf-linea": S.recForm.lineas.push({ art: "", cant: "", rollos: "" }); return render();
    case "rf-quitar": S.recForm.lineas.splice(+el.dataset.row, 1); return render();
    case "rf-cancelar": S.recForm = null; return render();
    case "cerrar": S.modal = null; return render();
    case "etiqueta": S.modal = { tipo: "etiqueta", codigo: el.dataset.cod }; return render();
    case "imprimir": return hacer(() => ACC.imprimir(pz));
    case "lote": S.modal = { tipo: "lote" }; return render();
    case "lote-ok": return hacer(() => { const m = ACC.imprimirLote(r); S.modal = null; return m });
    case "terminar": return hacer(() => ACC.terminar(r));
    case "enviar": return hacer(() => ACC.enviar(r));
    case "aprobar": return hacer(() => ACC.decidir(r, "aprobada"));
    case "rechazar": return hacer(() => ACC.decidir(r, "rechazada"));
    case "liberar": return hacer(() => ACC.liberar(r, false));
    case "liberar-todas": return hacer(() => ACC.liberar(r, true));
    case "inc": S.modal = { tipo: "inc", codigo: el.dataset.cod }; render(); document.getElementById("inc-desc")?.focus(); return;
    case "inc-guardar": { const p = D.piezas.find(x => x.codigo === S.modal.codigo); return hacer(() => { const m = ACC.incidencia(r, p, S.modal.desc || ""); S.modal = null; return m }) }
    case "anular": S.modal = { tipo: "anular", codigo: el.dataset.cod }; return render();
    case "anular-ok": { const p = D.piezas.find(x => x.codigo === S.modal.codigo); return hacer(() => { const m = ACC.anular(r, p); S.modal = null; return m }) }
    case "resolver": return hacer(() => ACC.resolver(r, r.incidencias[+el.dataset.k], el.dataset.ok === "1"));
    case "ir-a": e.preventDefault(); document.getElementById(el.dataset.to)?.scrollIntoView({ behavior: "smooth" }); return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal) { S.modal = null; render() }
  else if (e.key === "Enter" && e.target.id === "tf-rollo") { e.preventDefault(); hacer(ACC_TRA.agregar); const i = document.getElementById("tf-rollo"); i?.focus(); i?.select() }
  else if (e.key === "Enter" && e.target.id === "aj-rollo") { e.preventDefault(); hacer(ACC_AJ.agregarRollo); const i = document.getElementById("aj-rollo"); i?.focus(); i?.select() }
  else if (e.key === "Enter" && e.target.dataset?.ajn && e.target.tagName === "INPUT") { e.preventDefault(); hacer(ACC_AJ.agregarNuevo); document.querySelector('[data-ajn="cant"]')?.focus() }
  else if (e.key === "Enter" && e.target.dataset?.motivo) { e.preventDefault(); const t = e.target.dataset.motivo; hacer(() => ACC_AJ.motivo(t, (S.motivoNuevo || {})[t])); document.querySelector(`[data-motivo="${t}"]`)?.focus() }
  else if (e.key === "Escape" && e.target.id === "ex-buscar" && S.buscarEx) { S.buscarEx = ""; render(); document.getElementById("ex-buscar")?.focus() }
  else if (e.key === "Escape" && e.target.id === "art-buscar" && S.buscarArt) { S.buscarArt = ""; render(); document.getElementById("art-buscar")?.focus() }
  if (e.key === "Enter" && e.target.dataset?.em !== undefined) { e.preventDefault(); document.querySelector('[data-act="em-ok"]')?.click() }
  if (e.key === "Enter" && e.target.matches("tr.click")) e.target.click();
});
document.addEventListener("input", e => {
  const t = e.target, ds = t.dataset;
  if (ds.af) { S.artForm[ds.af] = t.value;
    if (ds.af === "linea" || ds.af === "categoria") {
      if (adoptarCategoria()) { const pos = t.selectionStart; render(); const i = document.getElementById(t.id); if (i) { i.focus(); try { i.setSelectionRange(pos, pos) } catch (x) {} } }
      refrescarSugerencias() }
    return }
  if (ds.row !== undefined && ds.col && S.artForm) {
    const fila = S.artForm.filas[+ds.row];
    if (ds.col === "codigo" || ds.col === "abr") { const pos = t.selectionStart; t.value = t.value.toUpperCase(); try { t.setSelectionRange(pos, pos) } catch (x) {} }
    fila[ds.col] = t.value;
    if (ds.col === "abr") fila.abrTocada = t.value.trim() !== "";
    if (ds.col === "codigo") fila.codTocado = t.value.trim() !== "";
    return refrescarSugerencias();
  }
  if (ds.pf) { S.provForm[ds.pf] = t.value; return }
  if (ds.em) { S.modal[ds.em] = t.value; return }
  if (ds.aj) { S.ajForm[ds.aj] = t.value; return }
  if (ds.tf) { S.traForm[ds.tf] = t.value; if (ds.tf === "origen" && S.traForm.destino === t.value) { S.traForm.destino = ALMACENES.find(a => a.id !== t.value).id; render() } return }
  if (t.id === "tf-rollo") { S.traForm.rollo = t.value; return }
  if (ds.rechTra) { (S.rechTra ||= {})[ds.rechTra] = t.value; return }
  if (t.id === "tr-anaquel") { S.traRec.anaquel = t.value; return }
  if (t.id === "tr-rollo") { S.traRec.rollo = t.value; return }
  if (t.id === "aj-rollo") { S.ajForm.rollo = t.value; return }
  if (ds.ajn) { S.ajForm.nuevo[ds.ajn] = t.value; if (ds.ajn === "art") { render(); document.querySelector('[data-ajn="cant"]')?.focus() } return }
  if (ds.rech) { (S.rech ||= {})[ds.rech] = t.value; return }
  if (ds.motivo) { (S.motivoNuevo ||= {})[ds.motivo] = t.value; return }
  if (ds.ajl !== undefined) { const l = S.ajForm.lineas[+ds.ajl]; l.cant = t.value; const p = D.piezas.find(x => x.codigo === l.cod), c = decimal(t.value), q = document.getElementById(`aj-queda-${ds.ajl}`);
    if (q) { const v = c > 0 ? r2(S.ajForm.tipo === "salida" ? cantDe(p) - c : cantDe(p) + c) : null; q.textContent = v === null ? "" : v < 0 ? "No alcanza" : v === 0 ? "Agotado" : cant(v, p.un); q.className = `num ${v !== null && v < 0 ? "neg" : ""}` } return }
  if (t.id === "ex-buscar") { S.buscarEx = t.value; const pos = t.selectionStart; render(); const i = document.getElementById("ex-buscar"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos) } catch (x) {} } return }
  if (t.id === "art-buscar") { S.buscarArt = t.value; const pos = t.selectionStart; render(); const i = document.getElementById("art-buscar"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos) } catch (x) {} } return }
  if (ds.uf) { S.ubiForm[ds.uf] = t.value; const pv = document.getElementById("uf-prev"); if (pv) pv.textContent = previaRack(S.ubiForm); return }
  if (t.id === "u-anaquel") { S.ubi.anaquel = t.value; return }
  if (t.id === "u-rollo") { S.ubi.rollo = t.value; return }
  if (ds.rf) { S.recForm[ds.rf] = t.value; return }
  if (ds.of) { S.ocForm[ds.of] = t.value; return }
  if (ds.ol !== undefined && ds.col !== "art") { S.ocForm.lineas[+ds.ol][ds.col] = t.value; return }
  if (ds.rl !== undefined && ds.col !== "art") { S.recForm.lineas[+ds.rl][ds.col] = t.value; return }
  if (t.id === "f-peso") S.form.peso = t.value;
  else if (t.id === "f-fab") S.form.fab = t.value;
  else if (t.id === "motivo") S.motivo = t.value;
  else if (t.id === "inc-desc") S.modal.desc = t.value;
});
document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if (ds.rl !== undefined && ds.col === "art") { S.recForm.lineas[+ds.rl].art = t.value; return render() }
  if (ds.ol !== undefined && ds.col === "art") { S.ocForm.lineas[+ds.ol].art = t.value; return render() }
  if (t.id === "rf-oc") { cargarOC(t.value); return render() }
  if (ds.of) { S.ocForm[ds.of] = t.value; return }
  if (ds.rf) { S.recForm[ds.rf] = t.value; return }
  if (t.id === "f-art") { S.form.art = t.value; S.form.peso = ""; S.form.fab = ""; render(); return listoParaPesar() }
  if (ds.sel) S.sel[ds.sel] = t.checked;
  else if (t.id === "user") { S.user = t.value; S.motivo = ""; render(); toast(`Ahora ves la aplicación como ${u().nombre}, ${u().rol.toLowerCase()}.`) }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "art-form") return hacer(ACC_ART.guardar);
  if (id === "prov-form") return hacer(ACC_PROV.guardar);
  if (id === "aj-form" || id === "tra-form") return;
  if (id === "tra-rec-form") {
    // Escáner: tras leer el anaquel, el foco pasa al rollo; tras cada rollo, vuelve al rollo.
    if (document.activeElement?.id === "tr-anaquel") { const r = document.getElementById("tr-rollo"); r?.focus(); r?.select(); return }
    hacer(() => ACC_TRA.recibir(traById(e.target.dataset.id), S.traRec.rollo, S.traRec.anaquel));
    const i = document.getElementById(S.traRec.anaquel.trim() ? "tr-rollo" : "tr-anaquel"); i?.focus(); return }
  if (id === "ex-buscar-form") { const i = document.getElementById("ex-buscar"); S.buscarEx = i.value; render();
    const hit = document.getElementById("ex-hit"); if (hit) hit.scrollIntoView({ block: "center" });
    const j = document.getElementById("ex-buscar"); j?.focus(); j?.select(); return }
  if (id === "art-buscar-form") { const i = document.getElementById("art-buscar"); S.buscarArt = i.value; render();
    const hit = document.getElementById("art-hit"); if (hit) hit.scrollIntoView({ block: "center" });
    const j = document.getElementById("art-buscar"); j?.focus(); j?.select(); return }
  if (id === "ubi-form") { hacer(ACC_UBI.guardar); return document.getElementById(S.ubiForm?.tipo === "muelle" ? "uf-codigo" : "uf-rack")?.focus() }
  if (id === "ubic-form") {
    // Escáner: tras leer el anaquel, el foco pasa al rollo; tras cada rollo, vuelve al rollo.
    if (S.ubi.anaquel.trim() && !S.ubi.rollo.trim() && document.activeElement?.id === "u-anaquel") return document.getElementById("u-rollo")?.focus();
    hacer(() => ACC.ubicar(recById(S.rec), S.ubi.rollo, S.ubi.anaquel)); return listoParaUbicar();
  }
  if (id === "oc-form") return hacer(ACC_OC.guardar);
  if (id === "rec-form") { hacer(ACC.crearRecepcion); return listoParaPesar() }
  if (id === "reg") { hacer(() => ACC.registrar(recById(S.rec))); return listoParaPesar() }
  if (id === "scan-form") {
    const q = document.getElementById("scan").value.trim().toUpperCase();
    if (!q) return;
    const p = D.piezas.find(x => x.codigo === q) || D.piezas.find(x => x.codigo.endsWith(q));
    if (!p) return toast(`No existe el rollo ${q} en esta empresa.`, true);
    document.getElementById("scan").value = "";
    ir("pieza", { pieza: p.codigo, rec: p.rec });
  }
});

document.getElementById("user").innerHTML = Object.entries(USERS).map(([k, v]) => `<option value="${k}">${v.nombre} · ${v.rol}</option>`).join("");
cargar();
render();
</script>
